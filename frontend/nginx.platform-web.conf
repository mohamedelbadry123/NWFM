# The platform app: landing page, subscription signup and the staff console. Its /api is the
# control plane only; it never reaches a tenant API.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  location /api/ { proxy_pass http://platform:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  # Unhashed files that change with every release: always revalidate.
  location /i18n/ { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /config/app-config.json { add_header Cache-Control "no-store, must-revalidate"; }
  location / { try_files $uri $uri/ /index.html; }
}
