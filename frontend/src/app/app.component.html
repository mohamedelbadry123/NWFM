<div class="min-h-screen bg-ink-50 text-ink-900">
  <header class="sticky top-0 z-40 border-b border-ink-200 bg-white px-5 py-3 flex flex-wrap items-center gap-5">
    <a routerLink="/org/workflow" class="text-xl font-bold tracking-wide text-primary">NWFM</a>
    <span class="text-sm text-ink-500">{{locale.isRtl() ? 'إدارة سير العمل' : 'Workflow management'}}</span>
    <div class="ms-auto flex flex-wrap items-center gap-4 text-sm">
      <label>{{locale.isRtl() ? 'المؤسسة' : 'Tenant'}} <select class="ms-2 rounded-lg border border-ink-200 px-2 py-1.5" aria-label="Tenant"><option>{{context.tenant()?.name || 'NWFM'}}</option></select></label>
      <label>{{locale.isRtl() ? 'المشارك' : 'Participant'}} <select class="ms-2 rounded-lg border border-ink-200 px-2 py-1.5" [ngModel]="context.selectedParticipantId()" (ngModelChange)="context.selectParticipant($event)" aria-label="Participant">
        @for(p of context.participants(); track p.id){<option [value]="p.id">{{locale.isRtl() ? (p.displayNameAr || p.displayName) : p.displayName}}</option>}
      </select></label>
      <button class="rounded-lg border border-ink-200 px-3 py-1.5" (click)="locale.setLocale(locale.isRtl() ? 'en' : 'ar')">{{locale.isRtl() ? 'English' : 'العربية'}}</button>
    </div>
  </header>
  <div class="flex flex-col lg:flex-row">
    <nav class="w-full lg:w-60 shrink-0 border-e border-ink-200 bg-white p-4 lg:min-h-[calc(100vh-70px)] flex flex-row flex-wrap lg:flex-col gap-1" aria-label="Workflow navigation">
      @for(link of links; track link.url){<a [routerLink]="link.url" routerLinkActive="bg-primary/10 text-primary font-semibold" [routerLinkActiveOptions]="{exact:true}" class="rounded-lg px-3 py-2 text-sm hover:bg-ink-50">{{locale.isRtl() ? link.ar : link.en}}</a>}
    </nav>
    <main class="min-w-0 flex-1 p-4 md:p-7">
      @if(context.error()){<div role="alert" class="rounded-xl border border-red-200 bg-red-50 p-6">{{context.error()}} <button class="underline ms-3" (click)="reload()">Retry</button></div>}
      @else {<router-outlet />}
    </main>
  </div>
  <div class="fixed bottom-5 end-5 z-50 space-y-2" aria-live="polite">@for(t of toast.toasts(); track t.id){<div role="status" class="max-w-md rounded-xl border bg-white p-4 shadow-lg" [class.border-red-300]="t.type === 'error'">{{t.message}}<button (click)="toast.dismiss(t.id)" class="ms-4" aria-label="Dismiss">×</button></div>}</div>
</div>
