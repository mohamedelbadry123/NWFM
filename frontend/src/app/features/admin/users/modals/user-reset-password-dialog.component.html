<p-dialog [(visible)]="visible" [header]="'users.resetPassword' | translate" [modal]="true" [style]="{ width: '28rem' }">
  <form [formGroup]="form" class="flex flex-col gap-3">
    <p class="text-sm">{{ 'users.resetPasswordHint' | translate }} {{ user()?.userName }}</p>
    <p-password formControlName="newPassword" [feedback]="false" [toggleMask]="true" styleClass="w-full" inputStyleClass="w-full" />
  </form>
  <ng-template pTemplate="footer">
    <p-button [label]="'common.cancel' | translate" severity="secondary" [text]="true" (onClick)="visible.set(false)" />
    <p-button [label]="'common.save' | translate" [loading]="saving()" (onClick)="save()" />
  </ng-template>
</p-dialog>
