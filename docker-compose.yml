name: nwfm
services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${NWFM_SQL_PASSWORD:?Set NWFM_SQL_PASSWORD in .env}
    volumes:
      - nwfm-sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      retries: 20
      start_period: 30s
  backend:
    build: ./backend
    environment:
      Urls: http://+:8080
      AllowedHosts: localhost;127.0.0.1;backend
      ConnectionStrings__DefaultConnection: Server=database;Database=NWFM;User Id=sa;Password=${NWFM_SQL_PASSWORD};TrustServerCertificate=True
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:5080:8080"
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      - backend
volumes:
  nwfm-sql:
